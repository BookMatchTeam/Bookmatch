name: Backend CD

on:
  # Automatico: quando o "Backend CI" termina na main.
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  # Manual: botao "Run workflow" na aba Actions, para republicar ou voltar
  # para um commit anterior da main.
  workflow_dispatch:
    inputs:
      commit:
        description: Commit da main a publicar (vazio = ultimo commit da main)
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGEM_API: ghcr.io/bookmatchteam/bookmatch-backend
  IMAGEM_MIGRATE: ghcr.io/bookmatchteam/bookmatch-backend-migrate

jobs:
  # 1. Monta as imagens aqui, na maquina do GitHub, e publica no GHCR.
  imagens:
    name: Montar e publicar as imagens
    # Automatico: so se o CI passou num push na main (nunca em PR).
    # Manual: so a partir da main.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.alvo.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Historico completo, para conferir que o commit pertence a main.
          fetch-depth: 0

      - name: Definir o commit
        id: alvo
        env:
          # Automatico: o commit que o CI testou.
          # Manual: o informado no botao ou, se vazio, o ultimo da main.
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.commit }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          sha="${RUN_SHA:-${INPUT_SHA:-$MAIN_SHA}}"
          if ! [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Commit invalido: '$sha'. Use o hash do commit (7 a 40 caracteres)."
            exit 1
          fi
          # Hash curto -> hash completo, que e a tag das imagens.
          if ! completo="$(git rev-parse --verify --quiet "$sha^{commit}")"; then
            echo "::error::O commit '$sha' nao existe no repositorio."
            exit 1
          fi
          sha="$completo"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::O commit $sha nao faz parte da main; deploy cancelado."
            exit 1
          fi
          git checkout --quiet --detach "$sha"
          echo "Commit a publicar: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Entrar no GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Montar e publicar
        env:
          SHA: ${{ steps.alvo.outputs.sha }}
        run: |
          # Republicar ou voltar versao: se as imagens deste commit ja existem,
          # usa as mesmas, sem montar de novo.
          if docker manifest inspect "$IMAGEM_API:$SHA" > /dev/null 2>&1 \
            && docker manifest inspect "$IMAGEM_MIGRATE:$SHA" > /dev/null 2>&1; then
            echo "Imagens de $SHA ja estao no GHCR; nada a montar."
            exit 0
          fi
          docker build --target runtime -t "$IMAGEM_API:$SHA" backend
          docker build --target migrate -t "$IMAGEM_MIGRATE:$SHA" backend
          docker push "$IMAGEM_API:$SHA"
          docker push "$IMAGEM_MIGRATE:$SHA"

  # 2. Envia so os arquivos de implantacao para a VPS, que baixa as imagens.
  deploy:
    name: Deploy na VPS
    needs: imagens
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://api-bookmatch.galpao.tech/health
    # Nunca dois deploys do backend ao mesmo tempo; o segundo espera o primeiro.
    concurrency:
      group: backend-deploy
      cancel-in-progress: false
    env:
      SHA: ${{ needs.imagens.outputs.sha }}
    steps:
      # Os arquivos de deploy vem do mesmo commit das imagens.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.imagens.outputs.sha }}
          sparse-checkout: backend/deploy

      - name: Conferir secrets da VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          faltando=""
          for nome in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!nome}" ] || faltando="$faltando $nome"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Secrets nao configurados:$faltando (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::VPS_PORT deve ser so o numero da porta do SSH (ex.: 22)."
            exit 1
          fi

      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            Port ${{ secrets.VPS_PORT }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Enviar compose e deploy.sh
        run: |
          tar -C backend/deploy -czf - compose.prod.yaml deploy.sh \
            | ssh vps 'mkdir -p ~/bookmatch && tar -xzf - -C ~/bookmatch'

      - name: Rodar o deploy na VPS
        env:
          # Token temporario deste job (so leitura de pacotes). Expira quando
          # o job termina e nao fica gravado na VPS.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO_GHCR: ${{ github.actor }}
        run: |
          echo "Versao: $SHA"
          # O token vai pela entrada padrao (nunca na linha de comando) e o
          # logout acontece no fim, mesmo se o deploy falhar.
          printf '%s' "$TOKEN" | ssh vps "
            set -e
            trap 'docker logout ghcr.io > /dev/null' EXIT
            docker login ghcr.io -u '$USUARIO_GHCR' --password-stdin > /dev/null
            IMAGE_TAG='$SHA' bash ~/bookmatch/deploy.sh
          "
