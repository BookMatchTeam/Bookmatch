name: Frontend CD

# Roda depois que o "Frontend CI" passa na main.
# Tambem pode ser disparado na mao (Actions > Frontend CD > Run workflow),
# inclusive para voltar a uma versao anterior informando o hash.
on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Hash (commit) de uma versao ja publicada no GHCR. Vazio = montar e publicar o commit atual da main."
        required: false
        default: ""

# Nunca dois deploys do frontend ao mesmo tempo; o segundo espera o primeiro.
concurrency:
  group: frontend-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bookmatchteam/bookmatch-frontend

jobs:
  build:
    name: Montar e publicar a imagem
    runs-on: ubuntu-latest
    # Via workflow_run: so se o CI passou e foi um push na main (nao PR).
    # Via botao com image_tag preenchido: pula o build (a imagem ja existe).
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.image_tag == '')
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.sha.outputs.tag }}
    steps:
      - name: Definir o commit
        id: sha
        run: echo "tag=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem (liga o pacote ao repositorio)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ steps.sha.outputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: build
    # Roda depois do build, ou sozinho quando o botao recebe um image_tag (rollback).
    if: >-
      always() &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.image_tag != ''))
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://bookmatch.galpao.tech
    env:
      TAG: ${{ needs.build.outputs.tag || inputs.image_tag }}
    steps:
      # Os arquivos de deploy vem do mesmo commit da imagem
      # (no rollback, vem da main atual: o compose/deploy.sh mais recentes).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag || github.sha }}
          sparse-checkout: frontend/deploy

      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            Port ${{ secrets.VPS_PORT || 22 }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Enviar compose e deploy.sh
        run: |
          tar -C frontend/deploy -czf - compose.prod.yaml deploy.sh \
            | ssh vps 'mkdir -p ~/bookmatch-frontend && tar -xzf - -C ~/bookmatch-frontend'

      - name: Rodar o deploy na VPS
        run: |
          echo "Versao: $TAG"
          # Login no GHCR com o token temporario deste job (expira quando o job acaba)
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          status=0
          ssh vps "IMAGE_TAG='$TAG' bash ~/bookmatch-frontend/deploy.sh" || status=$?
          ssh vps "docker logout ghcr.io" || true
          exit $status
